<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Music formatter</title>
  <script src="./devjs/formatMusic.js"></script>

  <style>
    label {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 1.5rem;
      font-weight: bold;
      display: block;
      margin-bottom: 1rem;
    }

    textarea {
      font-family: Arial, Helvetica, sans-serif;
      display: block;
    }
  </style>
</head>
<body>
  <form>
    <label for="input">Music list (Formatted as: "Title;Length;Slug;Cover" with one song per line)</label>
    <textarea id="input" rows="20" cols="100"></textarea>
    <button onclick="generateTable()" type="button">Convert to table</button>
  </form>
  <hr>
  <h4>Preview</h4>
  <div id="preview"></div>
  <hr>
  <h4>Code</h4>
  <pre id="output"></pre>
</body>
</html>
