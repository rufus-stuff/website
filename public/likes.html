<!DOCTYPE html>
<html lang="en">
<head>
  {{ head-content }}
  <link href="css/view/likes.css" rel="stylesheet" type="text/css" media="all">
  <script src="scripts/apps/likesViewer.js" defer></script>

  <title>Stuff I Like | Rufus</title>
</head>
<body>
  <div class="window" style="width: 760px; height: 90dvh;">
    <div class="window-bar">
      <p>I like many things</p>
      <button aria-label="Minimize window"></button>
    </div>
    <main class="window-view">
      <div class="view-dual-panel">
        <div class="scrollable">
          <div>
            <h2>Here's stuff I like</h2>
            <p>If ever wonder about what we can chat about, I'm always happy to spend hours on any of these topics!</p>
          </div>
          <div class="view-grid">
          {{ list/likes/itemButton#main }}
          </div>
        </div>
        <div class="view-details scrollable">
          {{ list/likes/content#main }}
        </div>
      </div>
    </main>
  </div>

  {{ taskbar }}
</body>
</html>
